name: Bootstrap source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Expand delivered Parts Engine source
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f bootstrap/READY ]]; then
            echo "Baseline archive chunks are not complete yet."
            exit 0
          fi

          cat bootstrap/chunk-*.b64 | base64 -d > /tmp/parts-engine.tar.xz
          echo "e9436d98a3583dfc01191e5a4dfef586ee7fc6dc2e68d46c9a7aafe2a6591b29  /tmp/parts-engine.tar.xz" | sha256sum -c -

          tmp="$(mktemp -d)"
          tar -xJf /tmp/parts-engine.tar.xz -C "$tmp"

          test -f "$tmp/parts-engine/package.json"
          test -f "$tmp/parts-engine/README.md"

          shopt -s dotglob
          cp -a "$tmp/parts-engine/." .

          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-source.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi

          git commit -m "chore: establish Parts Engine baseline"
          git push origin HEAD:main
